<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استخراج صدا از ویدیو | Quiz Server</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .video-shell { max-width: 1050px; margin: 40px auto; padding: 0 16px 140px; }
        .video-head { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
        .video-head h1 { margin:0; flex:1; }
        .card {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            border-radius: 12px; padding: 20px; margin-bottom: 20px;
        }
        .card h3 {
            margin: 0 0 14px; font-size: 1rem; color: var(--accent);
            display:flex; align-items:center; gap:8px;
        }
        .path-row { display:flex; gap:8px; }
        .path-row input { flex:1; }
        .quick-dirs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
        .quick-dirs button {
            background: var(--bg-elevated); border:1px solid var(--border-subtle);
            color: var(--text-secondary); padding: 5px 12px; border-radius:6px;
            cursor:pointer; font-size:0.8rem; font-family:monospace;
        }
        .quick-dirs button:hover { color: var(--accent); border-color: var(--accent); }
        .hint { font-size:0.78rem; color:var(--text-tertiary); margin-top:6px; }

        /* entries */
        .entries { display:flex; flex-direction:column; gap:10px; }
        .entry {
            background: var(--bg-elevated); border:1px solid var(--border-subtle);
            border-radius:10px; padding:12px 14px;
            display:grid; grid-template-columns: 28px 1fr; gap:12px;
            transition: border-color .15s, background .15s;
        }
        .entry.selected { border-color: var(--accent); background: rgba(59,130,246,0.06); }
        .entry input[type=checkbox] { margin-top:4px; transform: scale(1.2); cursor:pointer; }
        .entry .body { min-width:0; }
        .entry .title { font-weight:600; font-size:0.95rem; margin-bottom:2px; }
        .entry .sub { font-size:0.75rem; color:var(--text-tertiary); font-family:monospace; direction:ltr; text-align:left; word-break:break-all; }
        .entry .chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 8px; }
        .entry .chips span {
            background: var(--bg-surface); padding:1px 8px; border-radius:999px;
            border:1px solid var(--border-subtle);
            font-size:0.72rem; color:var(--text-tertiary);
        }
        .entry .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .entry input.name {
            flex:1; min-width:160px; padding:6px 10px;
            background: var(--bg-surface); color: var(--text-primary);
            border:1px solid var(--border-subtle); border-radius:6px;
            font-family:monospace; direction:ltr; text-align:left; font-size:0.85rem;
        }
        .entry select {
            padding:6px 10px; border-radius:6px;
            background: var(--bg-surface); color: var(--text-primary);
            border:1px solid var(--border-subtle); font-size:0.85rem;
        }

        /* batch bar */
        .batch-bar {
            position: sticky; bottom: 16px; z-index: 50;
            background: var(--bg-elevated);
            border:1px solid var(--border-default);
            border-radius: 12px; padding: 12px 16px;
            display:flex; align-items:center; gap:14px; flex-wrap:wrap;
            box-shadow: 0 6px 24px rgba(0,0,0,0.35);
            margin-top: 16px;
        }
        .batch-bar label { display:flex; align-items:center; gap:6px; font-size:0.85rem; cursor:pointer; }
        .batch-bar input[type=checkbox] { transform: scale(1.15); cursor:pointer; }
        .batch-bar .sep { flex:1; }
        .batch-bar .count {
            background: var(--accent); color:#fff; padding:2px 10px;
            border-radius:999px; font-size:0.78rem; font-weight:700;
        }

        /* queue */
        .queue-list { display:flex; flex-direction:column; gap:6px; max-height:400px; overflow-y:auto; }
        .q-item {
            display:grid;
            grid-template-columns: 24px 1fr auto;
            gap:10px; align-items:center;
            padding: 8px 12px; border-radius:8px;
            background: var(--bg-elevated);
            border:1px solid var(--border-subtle);
            font-size:0.85rem;
        }
        .q-item .q-title { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .q-item .q-sub { font-size:0.72rem; color:var(--text-tertiary); font-family:monospace; direction:ltr; text-align:left; }
        .q-item .q-status {
            font-size:0.72rem; padding:2px 10px; border-radius:999px;
            font-family:monospace; direction:ltr;
        }
        .q-item.pending .q-status { background: rgba(148,163,184,0.15); color:#94a3b8; }
        .q-item.processing { border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.05); }
        .q-item.processing .q-status { background: rgba(245,158,11,0.2); color:#f59e0b; }
        .q-item.done { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.05); }
        .q-item.done .q-status { background: rgba(34,197,94,0.2); color:#22c55e; }
        .q-item.error { border-color: rgba(244,63,94,0.4); background: rgba(244,63,94,0.05); }
        .q-item.error .q-status { background: rgba(244,63,94,0.2); color:#f43f5e; }
        .q-item .q-num {
            width:22px; height:22px; border-radius:50%;
            background: var(--bg-surface); border:1px solid var(--border-subtle);
            display:flex; align-items:center; justify-content:center;
            font-size:0.7rem; color: var(--text-tertiary);
        }
        .q-item.processing .q-num { border-color:#f59e0b; color:#f59e0b; }
        .q-item.done .q-num { border-color:#22c55e; color:#22c55e; }
        .q-item.error .q-num { border-color:#f43f5e; color:#f43f5e; }

        .q-progress {
            display:flex; align-items:center; gap:12px;
            margin-bottom:14px;
        }
        .q-progress-bar {
            flex:1; height:8px; border-radius:4px;
            background: var(--bg-elevated); overflow:hidden;
            border:1px solid var(--border-subtle);
        }
        .q-progress-fill {
            height:100%; width:0%; background: linear-gradient(90deg,#8b5cf6,#3b82f6);
            transition: width .3s;
        }
        .q-progress-text { font-size:0.8rem; color:var(--text-secondary); font-family:monospace; }

        .q-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }

        .spin {
            display:inline-block; width:11px; height:11px;
            border:2px solid currentColor; border-top-color:transparent;
            border-radius:50%; vertical-align:middle;
            animation: spin .7s linear infinite; margin-left:5px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-box {
            background: var(--bg-elevated); border:1px solid var(--border-subtle);
            border-radius:8px; padding:10px 12px; font-family:monospace;
            font-size:0.82rem; color: var(--text-secondary);
            margin-top: 12px; min-height:1.4em; white-space:pre-wrap;
        }
        .status-box.ok { color:#22c55e; border-color:#22c55e55; }
        .status-box.err { color:#f43f5e; border-color:#f43f5e55; }
        .status-box.loading { color:#f59e0b; border-color:#f59e0b55; }
    </style>
</head>
<body>
<div class="video-shell">
    <header class="video-head">
        <a href="/" class="back-btn">←</a>
        <h1>🎬 استخراج صدا از ویدیوهای لوکال</h1>
        <a href="/audio" class="btn btn-ghost">🎧 ضبط صدا</a>
    </header>

    <!-- ══ SCAN ══ -->
    <section class="card">
        <h3>📁 مسیر پوشه یا فایل ویدیو</h3>
        <div class="path-row">
            <input type="text" id="dirPath" class="form-input mono"
                   placeholder="/home/user/Videos  یا  /path/to/video.mp4"
                   autocomplete="off" spellcheck="false"
                   style="padding:10px 12px;border:1px solid var(--border-subtle);border-radius:8px;background:var(--bg-elevated);color:var(--text-primary);">
            <button class="btn btn-primary" id="btnScan">🔍 اسکن</button>
        </div>
        <div class="quick-dirs" id="quickDirs"></div>
        <div class="hint">
            می‌تونی مسیر یک پوشه بدی (اسکن می‌کنه و همه ویدیوها رو نشون می‌ده) یا مسیر مستقیم یک فایل.
        </div>
        <div class="status-box" id="scanStatus" style="display:none;"></div>
    </section>

    <!-- ══ ENTRIES ══ -->
    <section class="card" id="entriesCard" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3 style="margin:0;" id="entriesTitle">ویدیوها</h3>
            <button class="btn btn-ghost btn-sm" id="btnCollapse">جمع کردن</button>
        </div>
        <div style="font-size:0.78rem;color:var(--text-tertiary);font-family:monospace;direction:ltr;margin-bottom:12px;" id="entriesMeta"></div>
        <div class="entries" id="entries"></div>

        <!-- Batch action bar -->
        <div class="batch-bar" id="batchBar" style="display:none;">
            <label>
                <input type="checkbox" id="selectAll">
                <span>انتخاب همه</span>
            </label>
            <span class="sep"></span>
            <span><span class="count" id="selectedCount">0</span> ویدیو انتخاب شده</span>
            <select id="batchFormat" style="padding:6px 10px;border-radius:6px;background:var(--bg-surface);color:var(--text-primary);border:1px solid var(--border-subtle);font-size:0.85rem;">
                <option value="mp3" selected>MP3</option>
                <option value="wav">WAV</option>
                <option value="flac">FLAC</option>
                <option value="m4a">M4A</option>
                <option value="opus">OPUS</option>
                <option value="aac">AAC</option>
            </select>
            <button class="btn btn-primary" id="btnAddToQueue">🎬 افزودن به صف پردازش</button>
            <button class="btn btn-ghost" id="btnClearSelection">پاک کردن انتخاب</button>
        </div>
    </section>

    <!-- ══ QUEUE ══ -->
    <section class="card" id="queueCard" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <h3 style="margin:0;">📋 صف پردازش</h3>
            <button class="btn btn-ghost btn-sm" id="btnQueueCollapse">جمع کردن</button>
        </div>

        <div class="q-progress">
            <div class="q-progress-bar">
                <div class="q-progress-fill" id="qProgressFill"></div>
            </div>
            <span class="q-progress-text" id="qProgressText">0 / 0</span>
        </div>

        <div class="queue-list" id="queueList"></div>

        <div class="q-actions">
            <button class="btn btn-primary" id="btnStartQueue">▶️ شروع پردازش</button>
            <button class="btn btn-danger" id="btnStopQueue" style="display:none;">⏹️ توقف بعد از این آیتم</button>
            <button class="btn btn-ghost" id="btnClearQueue">🗑️ پاک کردن صف</button>
        </div>

        <div class="status-box" id="queueStatus" style="display:none;"></div>
    </section>
</div>

<script src="/static/js/sanitize.js"></script>
<script src="/static/js/video_page.js"></script>
  <script src="/static/js/fa_digits.js" defer></script>
</body>
</html>
